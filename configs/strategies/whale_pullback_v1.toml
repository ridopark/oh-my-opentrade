schema_version = 2

[strategy]
id = "whale_pullback_v1"
version = "1.0.0"
name = "Whale Pullback v1 — VWAP/EMA/Volume Profile"
description = "Three-step rule: VWAP-side trend with large-candle break, EMA(N) pullback with body confirm, then a clear-path veto from the prior-session HVN volume profile. Equity-only, paper-only on first ship."
author = "system"
created_at = "2026-05-06T00:00:00Z"

[lifecycle]
state = "Deactivated"
paper_only = true
# Sunset 2026-05-06. Post-fix backtest revealed PF 0.388 train / 0.450
# holdout at default params with no recoverable parameter slice (entry-
# quality problem, not exit tuning). See
# _workspace/whale_pullback_v1_sunset_note.md
# Deactivated lifecycle prevents router assignment. Strategy code stays
# in backend/internal/app/strategy/builtin/whale_pullback_v1.go for history.

[routing]
symbols = ["TSLA", "MRNA", "HIMS", "SPY", "AMD", "NFLX", "COIN", "AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "AVGO", "MU", "MRVL", "SMCI", "PLTR", "CRM", "SNOW", "NET", "SOFI", "HOOD", "AFRM", "JPM", "XOM", "OXY", "LLY", "RIVN", "RBLX", "BA", "QQQ", "IWM", "SOXL"]
timeframes = ["5m"]
priority = 70
conflict_policy = "priority_wins"
exclusive_per_symbol = false
watchlist_mode = "static"
asset_classes = ["EQUITY"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = """\
Trend-pullback strategy for liquid US equities and ETFs.

IDEAL CANDIDATES (score 4-5):
- Daily ATR% >= 1.5% (clean intraday legs above/below VWAP)
- Strong directional opens (gap or first-hour drive) so the VWAP-break
  filter triggers cleanly
- Reliable RVOL (>= 1.0x) so the prior-session HVN profile is meaningful
- Tight bid/ask in 5m bars (large-cap or mega-cap tickers)

POOR CANDIDATES (score 0-1):
- ATR% < 0.8% (chop dominates; VWAP-break filter never qualifies)
- Persistent trading inside the prior HVN cluster (clear-path veto fires)
- Halted / illiquid bars
"""

[params]
ema_period = 9
pullback_touch_atr = 0.15
min_trend_bars = 3
vwap_break_atr = 0.5
vp_lookback_days = 5
vp_bin_bps = 10
vp_hvn_threshold_pct = 80.0
vp_clear_atr = 0.6
vp_required = true
vp_rth_only = true
atr_stop_mult = 1.75
exit_body_closes = 2
cooldown_seconds = 1800
max_trades_per_day = 3
allowed_hours_start = "09:35"
allowed_hours_end = "15:30"
allowed_hours_tz = "America/New_York"

[hooks]
signals = { engine = "builtin", name = "whale_pullback_v1" }

# v1 conservative cap until atr_stop_mult-based ATR stop is wired through
# the exit-rule engine.
[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.015

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 60
sd_threshold = 0
profit_gate_pct = 0.005

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15

[options]
enabled = false
