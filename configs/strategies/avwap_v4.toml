schema_version = 2

[strategy]
id = "avwap_v4"
version = "4.3.0"
name = "AVWAP v4.3 - Confluence-Weighted Entries"
description = "Anchored VWAP strategy with multi-anchor lines, confluence-weighted entries, price-action exits, and options trading."
author = "system"
created_at = "2026-03-29T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NFLX", "NVDA", "AMD", "AVGO", "MU", "MRVL", "SMCI", "PLTR", "CRM", "SNOW", "NET", "SOFI", "HOOD", "COIN", "AFRM", "JPM", "XOM", "OXY", "LLY", "MRNA", "HIMS", "RIVN", "RBLX", "BA", "SPY", "QQQ", "IWM", "SOXL"]
timeframes = ["5m"]
priority = 80
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
asset_classes = ["OPTION"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = """\
Anchored VWAP momentum/mean-reversion strategy trading options on US equities.

IDEAL CANDIDATES (score 4-5):
- Daily ATR% >= 2.0% (need intraday movement for AVWAP entries)
- Gap% between 1-8% absolute (provides clear anchor point for AVWAP)
- RVOL >= 1.5x (volume confirmation for breakout/pullback)
- EMA200 bias matches gap direction (trend alignment)
- NR7 = Y is a bonus (compression before expansion)

POOR CANDIDATES (score 0-1):
- ATR% < 1.0% (too slow, AVWAP entries won't trigger)
- Gap% < 0.5% (no clear anchor event)
- RVOL < 0.5x (no institutional participation)
- Leveraged ETFs (SOXL, TQQQ, SQQQ) — synthetic price action, poor VWAP respect

Score = probability this symbol generates a valid AVWAP entry signal today.\
"""

[params]
# --- Anchors ---
# AVWAP lines anchored at session open and previous day's high/low
anchors = ["session_open", "pd_high", "pd_low"]

# --- Entry Types ---
# Breakout: price sustains above/below AVWAP for hold_bars with volume confirmation
breakout_enabled = true
hold_bars = 5

# Pullback: price pulls back to AVWAP in an established trend, closes on right side
pullback_enabled = false
pullback_trend_bars = 5
pullback_tolerance_bps = 25
pullback_rsi_min = 30.0
pullback_rsi_max = 65.0

# Bounce: mean-reversion touch of AVWAP with RSI confirmation (disabled — lowest conviction)
bounce_enabled = false
rsi_bounce_max = 35.0

# Pinch: dual-AVWAP compression breakout (gap between anchors narrows)
pinch_enabled = true
pinch_min_bps = 5
pinch_max_bps = 30

# Gap Reclaim: price dips below AVWAP then reclaims it within N bars
gap_reclaim_enabled = true
gap_reclaim_bars = 5

# Handoff: momentum acceleration away from AVWAP (consecutive bars of increasing distance)
handoff_enabled = false
handoff_bars = 5
handoff_min_mom_bps = 40

# --- Volume & Regime ---
# Minimum volume multiple vs 20-bar SMA to confirm entries
volume_mult = 2.0

# Allowed EMA regimes (TREND matches both TREND_UP and TREND_DOWN)
allow_regimes = ["TREND", "BALANCE", "REVERSAL"]

# Underlying asset class (used for midday trap shield and session hours)
asset_class = "EQUITY"

# --- Structural Filters ---
# Require consecutive higher lows for long breakout entries
require_higher_lows = true
higher_lows_bars = 5

# Block entries during 11:00-13:00 ET unless volume exceeds this multiple
midday_trap_shield = true
midday_volume_mult = 2.0

# Directional bias: only long when price is above AVWAP, only short when below
enforce_avwap_bias = true

# AVWAP slope must exceed this threshold (bps/bar) for trend confirmation
min_slope_bps = 0.6
slope_lookback = 15

# Shorts above AVWAP require a capitulation event (below AVWAP = "guilty", no capitulation needed)
require_capitulation_for_shorts = true

# --- Risk ---
# Underlying stop distance in basis points
stop_bps = 75

# Limit order offset from current price in basis points
limit_offset_bps = 5

# Maximum risk per trade as basis points of equity
risk_per_trade_bps = 2000

# Maximum position size as basis points of equity
max_position_bps = 3000

# --- Timing ---
# Trading window (ET). Entries only allowed within this range.
allowed_hours_start = "04:00"
allowed_hours_end = "15:45"
allowed_hours_tz = "America/New_York"

# Cooldown between trades on the same symbol (seconds)
cooldown_seconds = 7200

# Maximum entries per symbol per session
max_trades_per_day = 1

# Bars to hold before basic AVWAP exit check fires
exit_hold_bars = 5

# --- AVWAP Stop ---
# Strategy-level exit when price closes on wrong side of AVWAP for N consecutive bars
avwap_stop_enabled = true
avwap_stop_bars = 2
avwap_stop_buffer_bps = 10

# --- Confluence Weighting ---
# Entries scored 0-10 based on confirmation factors. Below threshold = filtered out.
min_confluence_score = 8

# Fibonacci convergence (+3): AVWAP aligns with 38.2%/50%/61.8% retracement
fib_confluence_enabled = true

# Key level alignment (+3): AVWAP converges with pd_high, pd_low, or_high, or_low
key_level_confluence_enabled = true

# Candlestick pattern (+2): Inside Bar, Morning Star, or strength candle
candle_confluence_enabled = true

# Band zone (+2): price within zone between min/max AVWAP lines
band_confluence_enabled = true

[hooks]
signals = { engine = "builtin", name = "avwap" }

[dynamic_risk]
enabled = true

# --- Exit Rules ---

# Swing stop: price-action trailing stop at recent swing low/high
# Buffer scales dynamically with ATR per symbol
[[exit_rules]]
type = "SWING_STOP"
[exit_rules.params]
lookback = 20
buffer_bps = 25
atr_buffer_mult = 3.0
min_bars = 20

# Stagnation exit: close trades that go nowhere after N minutes
[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 60
sd_threshold = 0
profit_gate_pct = 0.005

# EOD flatten: close all positions before market close
[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15

# Max loss: hard stop on adverse underlying move
[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.02

# --- Options ---

[options]
enabled = true

# Cap contract count to limit spread drag on cheap options
max_contracts = 5

[options.defaults]
min_dte = 7
max_dte = 21
target_delta_low = 0.40
target_delta_high = 0.55
min_open_interest = 50
max_spread_pct = 0.08
max_iv = 0.8

[options.regime_overrides.BALANCE]
target_delta_low = 0.35
target_delta_high = 0.50
min_dte = 7
max_dte = 21

# No symbol overrides — same params for all symbols to avoid overfitting
