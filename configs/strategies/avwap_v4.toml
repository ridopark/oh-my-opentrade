schema_version = 2

[strategy]
id = "avwap_v4"
version = "4.0.0"
name = "AVWAP v4 - Filtered Breakout"
description = "Single anchor, volume-confirmed breakouts, morning-only, STEP_STOP exits"
author = "system"
created_at = "2026-03-25T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "U", "PLTR", "SPY", "META", "NVDA"]
timeframes = ["5m"]
priority = 80
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "replace"
asset_classes = ["OPTION"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = "Event-based AVWAP: anchors at perception changes (earnings, gaps, swings), pullback + breakout + pinch + gap reclaim entries with directional bias and slope confirmation."

[params]
# Event-based anchors
anchors = ["session_open", "pd_high", "pd_low"]
# Breakout — tightened for higher conviction
breakout_enabled = true
hold_bars = 8
volume_mult = 2.0
# Bounce disabled — lowest conviction, catches falling knives with options
bounce_enabled = false
rsi_bounce_max = 35.0
exit_hold_bars = 4
cooldown_seconds = 1800
max_trades_per_day = 2
allow_regimes = ["TREND", "BALANCE"]
asset_class = "EQUITY"
# Stronger structural confirmation
require_higher_lows = true
higher_lows_bars = 5
# Block midday chop
midday_trap_shield = true
midday_volume_mult = 2.5
stop_bps = 75
limit_offset_bps = 5
risk_per_trade_bps = 500
max_position_bps = 2000
# Morning momentum window
allowed_hours_start = "09:35"
allowed_hours_end = "11:30"
allowed_hours_tz = "America/New_York"
# Directional bias: long only above AVWAP, short only below
enforce_avwap_bias = true
# Pullback — primary entry (highest conviction)
pullback_enabled = true
pullback_trend_bars = 5
pullback_tolerance_bps = 25
pullback_rsi_min = 30.0
pullback_rsi_max = 65.0
# Slope confirmation
min_slope_bps = 0.3
slope_lookback = 15
# Capitulation required for shorts
require_capitulation_for_shorts = true
# AVWAP-based stop
avwap_stop_enabled = true
avwap_stop_bars = 2
avwap_stop_buffer_bps = 10
# Pinch — high conviction breakout from squeeze
pinch_enabled = true
pinch_min_bps = 5
pinch_max_bps = 50
# Gap reclaim disabled — small edge, often fades
gap_reclaim_enabled = false
gap_reclaim_bars = 5

[hooks]
signals = { engine = "builtin", name = "avwap" }

[dynamic_risk]
enabled = false

# STEP_STOP replaces VOLATILITY_STOP — ratcheting stop that lets winners run
[[exit_rules]]
type = "STEP_STOP"
[exit_rules.params]
min_hold_bars = 6
bar_minutes = 5

# SD target for profit taking
[[exit_rules]]
type = "SD_TARGET"
[exit_rules.params]
sd_level = 1.5
min_hold_bars = 6
bar_minutes = 5

# Kill zombie trades — extended for options (theta needs time)
[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 90
sd_threshold = 1.0
profit_gate_pct = 0.005

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15

# Tighter hard stop
[[exit_rules]]
# Max loss tightened — with delta 0.60, 0.8% underlying ≈ 5% premium loss
# This matches the SD_TARGET profit magnitude for ~1:1 R:R
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.008

[options]
enabled = true

[options.defaults]
min_dte = 14
max_dte = 45
target_delta_low = 0.55
target_delta_high = 0.75
min_open_interest = 50
max_spread_pct = 0.08
max_iv = 1.5

[options.regime_overrides.BALANCE]
target_delta_low = 0.50
target_delta_high = 0.70
min_dte = 14
max_dte = 45

[symbol_overrides.TSLA]
stop_bps = 120
