schema_version = 2

[strategy]
id = "avwap_v4"
version = "4.0.0"
name = "AVWAP v4 - Filtered Breakout"
description = "Single anchor, volume-confirmed breakouts, morning-only, STEP_STOP exits"
author = "system"
created_at = "2026-03-25T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "U", "PLTR", "SPY", "META", "NVDA"]
timeframes = ["5m"]
priority = 80
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "replace"
asset_classes = ["EQUITY", "OPTION"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = "Volume-confirmed AVWAP breakouts with structural filters. Single session_open anchor, morning-only window, TREND regime gate, higher-lows confirmation. STEP_STOP replaces VOLATILITY_STOP for asymmetric exits."

[params]
# Single anchor — session_open is the most meaningful intraday level
anchors = ["session_open"]
breakout_enabled = true
# 10 bars = 50min sustained breakout on 5m — filters noise
hold_bars = 5
# Require 1.2x average volume for institutional conviction
volume_mult = 1.2
# Enable bounce for mean-reversion in BALANCE regime
bounce_enabled = true
rsi_bounce_max = 35.0
# 4 bars below AVWAP before strategy exit
exit_hold_bars = 4
# 15min cooldown prevents revenge trading
cooldown_seconds = 600
max_trades_per_day = 4
# TREND only — breakouts fail in BALANCE/ranging markets
allow_regimes = ["TREND", "BALANCE"]
asset_class = "EQUITY"
# Require ascending lows before entry
require_higher_lows = true
higher_lows_bars = 3
# Block midday chop
midday_trap_shield = true
midday_volume_mult = 2.5
stop_bps = 75
limit_offset_bps = 5
risk_per_trade_bps = 100
max_position_bps = 1000
# Morning session only — afternoon shorts are toxic
allowed_hours_start = "09:50"
allowed_hours_end = "11:30"
allowed_hours_tz = "America/New_York"

[hooks]
signals = { engine = "builtin", name = "avwap_v1" }

[dynamic_risk]
enabled = false

# STEP_STOP replaces VOLATILITY_STOP — ratcheting stop that lets winners run
[[exit_rules]]
type = "STEP_STOP"
[exit_rules.params]
min_hold_bars = 6
bar_minutes = 5

# Wider SD target for better R:R
[[exit_rules]]
type = "SD_TARGET"
[exit_rules.params]
sd_level = 2.0
min_hold_bars = 10
bar_minutes = 5

# Kill zombie trades that go nowhere
[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 60
sd_threshold = 1.0
profit_gate_pct = 0.003

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15

# Tighter hard stop
[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.020

[options]
enabled = true

[options.defaults]
min_dte = 35
max_dte = 45
target_delta_low = 0.45
target_delta_high = 0.60
min_open_interest = 100
max_spread_pct = 0.10
max_iv = 1.0

[options.regime_overrides.BALANCE]
target_delta_low = 0.35
target_delta_high = 0.50
min_dte = 30
max_dte = 50

[symbol_overrides.TSLA]
stop_bps = 120
