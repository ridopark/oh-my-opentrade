schema_version = 2

[strategy]
id = "macd_only_v1"
version = "1.0.0"
name = "MACD Crossover (Trading Rush)"
description = "30m MACD crossover below zero + 200 MA + EMA9 filter, 1.5x R:R"
author = "system"
created_at = "2026-04-06T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "NVDA", "TSLA", "META", "AMZN", "GOOGL"]
timeframes = ["30m"]
priority = 70
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
allowed_directions = ["LONG", "SHORT"]

[params]
# Mode: "macd_only" — pure MACD crossover, no BB
mode = "macd_only"

# MACD crossover must occur below zero line (Trading Rush rule)
macd_below_zero_required = true

# BB threshold (unused in macd_only mode but needed for config parsing)
bb_breakout_threshold = 1.0

# Risk:Reward
risk_reward_ratio = 1.5

# Swing low/high lookback for stop placement (~2 trading days on 30m)
swing_lookback = 26

# Volume
volume_mult = 1.0

# Timing
allowed_hours_start = "09:30"
allowed_hours_end = "15:45"
allowed_hours_tz = "America/New_York"
cooldown_seconds = 900
max_trades_per_day = 3
stabilization_bars = 10

[hooks]
signals = { engine = "builtin", name = "bollinger_macd" }

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15
