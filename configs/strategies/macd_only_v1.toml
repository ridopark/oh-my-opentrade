schema_version = 2

[strategy]
id = "macd_only_v1"
version = "1.1.0"
name = "MACD Crossover (Trading Rush)"
description = "30m MACD crossover + 200 MA + EMA9 filter, 1.5x R:R, aggressive sizing"
author = "system"
created_at = "2026-04-06T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL","AFRM","AMD","AMZN","AVGO","BA","COIN","CRM","GOOGL","HIMS","HOOD","IWM","JPM","LLY","META","MRNA","MRVL","MSFT","MU","NET","NFLX","NVDA","OXY","PLTR","QQQ","RBLX","RIVN","SMCI","SNOW","SOFI","SOXL","SPY","TSLA","XOM"]
timeframes = ["15m"]
priority = 70
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
allowed_directions = ["LONG", "SHORT"]

[params]
mode = "macd_only"

# MACD zero band — effectively disabled (any crossover)
macd_zero_band = 0.0

# BB threshold (unused in macd_only mode)
bb_breakout_threshold = 1.0

# Risk:Reward — 1.5x (Trading Rush original)
risk_reward_ratio = 3.0

# Swing low/high lookback (~2 trading days on 30m)
swing_lookback = 7

# Volume — no filter
volume_mult = 1.0

# Risk — 0.5% risk per trade, 15% max position
risk_per_trade_bps = 300
max_position_bps = 1500

# Timing — shorter cooldown for more trades
allowed_hours_start = "09:30"
allowed_hours_end = "12:00"
allowed_hours_tz = "America/New_York"
cooldown_seconds = 300
max_trades_per_day = 5
stabilization_bars = 10

[hooks]
signals = { engine = "builtin", name = "bollinger_macd" }

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15
