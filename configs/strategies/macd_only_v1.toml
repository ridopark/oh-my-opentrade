schema_version = 2

[strategy]
id = "macd_only_v1"
version = "2.0.0"
name = "MACD Crossover Options (Trading Rush)"
description = "15m MACD crossover + options, morning only, 3x R:R"
author = "system"
created_at = "2026-04-07T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL","AFRM","AMD","AMZN","AVGO","BA","COIN","CRM","GOOGL","HIMS","HOOD","IWM","JPM","LLY","META","MRNA","MRVL","MSFT","MU","NET","NFLX","NVDA","OXY","PLTR","QQQ","RBLX","RIVN","SMCI","SNOW","SOFI","SOXL","SPY","TSLA","XOM"]
timeframes = ["15m"]
priority = 70
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
asset_classes = ["OPTION"]
allowed_directions = ["LONG", "SHORT"]

[params]
mode = "macd_only"
macd_zero_band = 0.0
bb_breakout_threshold = 1.0
risk_reward_ratio = 3.0
swing_lookback = 7
volume_mult = 1.0

# Risk
risk_per_trade_bps = 300
max_position_bps = 1500

# Timing — morning only
allowed_hours_start = "09:30"
allowed_hours_end = "12:00"
allowed_hours_tz = "America/New_York"
cooldown_seconds = 300
max_trades_per_day = 5
stabilization_bars = 10

[hooks]
signals = { engine = "builtin", name = "bollinger_macd" }

[options]
enabled = true
max_contracts = 5
limit_spread_pct = 1.00
limit_buffer_bps = 1000
stale_cancel_secs = 90

[options.defaults]
min_dte = 7
max_dte = 21
target_delta_low = 0.40
target_delta_high = 0.55
min_open_interest = 50
max_spread_pct = 0.10
max_iv = 1.2

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15
