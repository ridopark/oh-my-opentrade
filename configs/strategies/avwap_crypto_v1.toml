schema_version = 2

[strategy]
id = "avwap_crypto_v1"
version = "1.0.0"
name = "AVWAP Crypto v1 - 24h Range with ET Session Anchors"
description = "Anchored VWAP strategy for 24/7 crypto via IBKR ZEROHASH. Full 24h pd range, ET session structure for entry timing."
author = "system"
created_at = "2026-04-13T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["BTC/USD", "ETH/USD"]
timeframes = ["5m"]
priority = 70
conflict_policy = "priority_wins"
exclusive_per_symbol = false
watchlist_mode = "static"
asset_classes = ["CRYPTO"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = """\
Anchored VWAP strategy for crypto (BTC, ETH) traded via IBKR ZEROHASH.
Uses ET session structure because US market hours drive 40-50% of daily
crypto volume. pd_high/pd_low use full 24h range to capture overnight moves.\
"""

[params]
# --- Anchors ---
anchors = ["session_open", "pd_high", "pd_low"]
pd_range_mode = "24H"

# --- Entry Types ---
breakout_enabled = true
hold_bars = 5

pullback_enabled = true
pullback_trend_bars = 5
pullback_tolerance_bps = 80
pullback_rsi_min = 30.0
pullback_rsi_max = 70.0

bounce_enabled = true
rsi_bounce_max = 35.0

pinch_enabled = true
pinch_min_bps = 5
pinch_max_bps = 60

gap_reclaim_enabled = true
gap_reclaim_bars = 15

handoff_enabled = true
handoff_bars = 3
handoff_min_mom_bps = 30

# --- Volume & Regime ---
volume_mult = 0.8
allow_regimes = ["TREND_UP", "TREND_DOWN"]
regime_blocked_directions = { TREND_UP = "SHORT", TREND_DOWN = "LONG" }
asset_class = "CRYPTO"

# --- Structural Filters ---
require_higher_lows = false
higher_lows_bars = 3
midday_trap_shield = false
enforce_avwap_bias = true
min_slope_bps = 0.3
slope_lookback = 10
require_capitulation_for_shorts = false

# --- Risk ---
stop_bps = 200
limit_offset_bps = 15
risk_per_trade_bps = 150
max_position_bps = 800

# --- Timing ---
session_weight_enabled = true
session_weight_tz = "America/New_York"
session_weight_open = 1.15          # 09:30-10:00 peak crypto volume
session_weight_extended_open = 1.00 # 10:00-10:30
session_weight_mid_morning = 0.85   # 10:30-12:00
session_weight_lunch = 0.70         # 12:00-14:00
session_weight_afternoon = 0.80     # 14:00-15:00
session_weight_moc = 0.75           # 15:00-15:30
session_weight_close = 0.70         # 15:30-16:00
session_weight_outside = 0.00       # block overnight entries entirely

allowed_hours_tz = "America/New_York"
cooldown_seconds = 300
max_trades_per_day = 4
max_positions = 4
max_per_group = 2
exit_hold_bars = 3
premium_hold_bars = 1

# --- AVWAP Stop ---
avwap_stop_enabled = true
avwap_stop_bars = 3
avwap_stop_buffer_bps = 30

# --- Confluence Weighting ---
min_confluence_score = 6
fib_confluence_enabled = true
key_level_confluence_enabled = true
candle_confluence_enabled = true
band_confluence_enabled = true
dp_confluence_enabled = false
dp_veto_enabled = false
dp_z_conditioning_enabled = false

[hooks]
signals = { engine = "builtin", name = "avwap" }

[dynamic_risk]
enabled = true

# --- Exit Rules ---

[[exit_rules]]
type = "MAX_HOLDING_TIME"
[exit_rules.params]
minutes = 240

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 240
sd_threshold = 0.3
profit_gate_pct = 0.005

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
max_loss_pct = 0.015

# No EOD flatten — crypto trades 24/7

[options]
enabled = false
