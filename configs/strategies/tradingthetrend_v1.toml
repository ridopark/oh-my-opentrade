schema_version = 2

[strategy]
id = "tradingthetrend_v1"
version = "1.0.0"
name = "TradingTheTrend v1 - Discord Watchlist Break-Retest"
description = "Validates Discord watchlist signals with a 3-phase break-and-retest state machine on the underlying, then buys the locked OCC option contract."
author = "system"
created_at = "2026-05-08T00:00:00Z"

# Ship deactivated. Phase 3a is entry signals only; mechanical exits (Phase 3b)
# are not implemented yet. Activate after Phase 3b/3d/3e land and the prereg
# backtest passes.
[lifecycle]
state = "Deactivated"
paper_only = true

[routing]
# Symbols are seeded at activation time from the watchlist. Empty list keeps
# the strategy registered without per-symbol Init bindings until the sidecar
# starts publishing tickers (see Phase 3e wiring).
symbols = []
timeframes = ["5m"]
priority = 90
conflict_policy = "priority_wins"
exclusive_per_symbol = false
watchlist_mode = "dynamic"
asset_classes = ["OPTION"]
allowed_directions = ["LONG"]

[screening]
description = "No screening. Author membership is the vetting layer."

[params]
# Entry knobs from prereg section 3 (locked).
expiry_dte             = 0       # 0 = nearest weekly Friday; positive int adds days
min_dte                = 2       # skip 0DTE
atr_breakout_mult      = 1.5
breakout_buffer_atr    = 0.2
body_range_ratio       = 0.5
vol_surge_mult         = 1.5
max_wick_ratio         = 0.4
retest_band_atr        = 0.15
retest_expiry_bars     = 20
invalidation_atr       = 0.5
retest_quality_gate    = true    # LOCKED ON per prereg
entry_cutoff_et        = "13:30"
trigger_drift_pct      = 0.5
freshness_max_age_secs = 60

[hooks]
signals = { engine = "builtin", name = "tradingthetrend_v1" }

[dynamic_risk]
enabled = false
