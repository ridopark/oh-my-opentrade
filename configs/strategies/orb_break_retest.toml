schema_version = 2

[strategy]
id = "orb_break_retest"
version = "1.0.0"
name = "ORB Break & Retest"
description = "Opening Range Breakout — Break & Retest with volume confirmation"
author = "system"
created_at = "2026-03-04T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NFLX", "NVDA", "AMD", "AVGO", "MU", "MRVL", "SMCI", "PLTR", "CRM", "SNOW", "NET", "SOFI", "HOOD", "COIN", "AFRM", "JPM", "XOM", "OXY", "LLY", "MRNA", "HIMS", "RIVN", "RBLX", "BA", "SPY", "QQQ", "IWM", "SOXL"]
timeframes = ["5m"]
priority = 100
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
asset_classes = ["OPTION"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = "Opening Range Breakout strategy that waits for price to break the ORB window(15min) range, then retests the breakout level before entry. CRITICAL: Only pick highly liquid stocks that trade continuously every minute during the first hour — minimum 500K average daily volume, preferably 1M+. Mid and large caps only."

[params]
bar_timeframe = "5m"
orb_window_minutes = 30            # TUNE: 30-min range like original omo config
min_rvol = 0.0                     # RVOL inert for ORB breakouts
min_confidence = 0.0               # JS has no confidence filter
breakout_confirm_bps = 6           # optimal — 2 worse, 10 worse
touch_tolerance_bps = 30           # JS: 0.3% retest tolerance
hold_confirm_bps = 1               # almost no hold confirmation needed (was 2)
max_retest_bars = 25               # revert — 12 slightly worse
allow_missing_range_bars = 2       # tolerate 2 missing bars (was 1)
max_signals_per_session = 3        # TUNE: try 3 signals
htf_bias_enabled = false           # JS has no HTF bias
atr_multiplier = 3.5
sweep_cooldown_bars = 1            # shorter cooldown after sweep (was 3)
retest_confirm_bars = 1            # 1 bar to confirm retest (was 2)
vwap_filter_enabled = false        # JS has no VWAP filter
vix_skip_above = 999               # JS has no VIX filter
vix_widen_above = 999              # JS has no VIX filter
max_range_atr_mult = 4.0           # accept wider ranges (was 2.5)
min_range_pct_bps = 10             # accept smaller ranges (was 20)
fvg_enabled = false                # JS has no FVG
fvg_min_rvol = 0.8
displacement_min_body_pct = 0.50   # 0.50 is optimal — 0.40 worse, 0.60 worse
displacement_min_range_pct = 0.002 # JS: range >= 0.2% of price
stop_bps = 40                      # swing stop overrides — fixed bps is fallback only
stop_buffer_bps = 10               # JS: 0.1% buffer on swing stop
limit_offset_bps = 15              # slightly more aggressive fill
risk_per_trade_bps = 300           # smaller size per trade (more attempts)
max_position_bps = 1500
allowed_hours_start = "09:30"
allowed_hours_end = "14:00"        # revert — timing doesn't help PF
allowed_hours_tz = "America/New_York"

[regime_filter]
enabled = true
allowed_regimes = ["TREND", "TREND_UP", "TREND_DOWN", "SQUEEZE", "RANGE", "NEUTRAL"]
block_counter_trend = true         # JS: block LONG in TREND_DOWN, SHORT in TREND_UP
min_atr_pct = 0.4

[hooks]
signals = { engine = "builtin", name = "orb_break_retest" }

[dynamic_risk]
enabled = true
min_confidence = 0.0             # JS has no confidence filter
risk_scale_min = 0.50
risk_scale_max = 1.00
stop_tight_mult = 0.60
stop_wide_mult = 1.50
size_tight_mult = 0.70
size_wide_mult = 1.50

[[exit_rules]]
type = "TIERED_TP"
[exit_rules.params]
first_tier_pct = 0.5       # exit 50% at first tier
first_tier_rr = 2.0        # 2.0 optimal — 1.5 worse PF
trail_pct = 0.015          # trail inert at MAX_LOSS=0.005 — keep for future loosening
initial_risk_pct = 0.005   # fallback R if swing stop unavailable

[[exit_rules]]
type = "TIME_PARTIAL"
[exit_rules.params]
minutes = 60               # after 60 min holding
partial_pct = 0.5          # close 50%
min_profit_pct = 0.001     # only if >= 0.1% profit

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 90
sd_threshold = 0.5
profit_gate_pct = 0.005

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 10

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.005                # 0.5% optimal — 0.7% and 1.0% both worse

[[exit_rules]]
type = "DTE_FLOOR"
[exit_rules.params]
dte = 1                    # JS: force close at DTE <= 1

[options]
enabled = true

# Limit price = mid + 60% of spread (aggressive for ORB breakout day trading)
limit_spread_pct = 1.00
# Fallback when spread is zero: ask + 3%
limit_buffer_bps = 1000
# Cancel unfilled option orders after 45 seconds (speed > price for ORB)
stale_cancel_secs = 45

[options.defaults]
min_dte = 5                # short DTE = high gamma, needed for ORB
max_dte = 10
target_delta_low = 0.45    # JS: ATM (strikeOffset=0)
target_delta_high = 0.55
min_open_interest = 100
max_spread_pct = 0.15      # JS: maxSpreadPct=0.15
max_iv = 1.5               # JS: maxVolatility=1.50
