schema_version = 2

[strategy]
id = "crypto_tsm_v1"
version = "1.0.0"
name = "Crypto Time-Series Momentum v1"
description = "Volume-weighted TS momentum on daily bars for crypto spot (Huang et al. 2024, Sharpe 1.51)"
novice_description = """\
Crypto markets tend to trend: coins that have been going up keep going up, \
and coins that have been going down keep going down — at least for a while. \
This is the "momentum" effect, and it has been documented in academic \
research for decades across stocks, commodities, and crypto.

Every day at the close, this strategy looks back over the last several \
months of daily prices for each coin (BTC, ETH, SOL) and scores how strong \
its recent trend has been, with extra weight given to days that had heavy \
trading volume (since those are the moves that matter most). If a coin's \
score is strongly positive, we hold a long position. If it's strongly \
negative, we go flat (or short, if enabled).

In plain terms: once a day, buy the crypto that has been trending up with \
real volume behind it, and get out when the trend fades."""
author = "system"
created_at = "2026-04-14T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["BTC/USD", "ETH/USD"]
timeframes = ["1d"]
priority = 60
conflict_policy = "priority_wins"
exclusive_per_symbol = false
watchlist_mode = "static"
asset_classes = ["CRYPTO"]
allowed_directions = ["LONG"]

[screening]
description = """\
Volume-weighted time-series momentum for 24/7 crypto markets.
Evaluates daily at 00:00 UTC. Long-only on IBKR ZEROHASH spot.
Academic basis: 28-day lookback with exp decay, volume-weighted returns,
z-scored against trailing 90-day window. Volume regime and volatility
cap filters prevent entries in contracting or crashing markets.\
"""

[params]
# --- Signal ---
lookback_days = 28
decay_tau_divisor = 3.0
zscore_window = 90
entry_z_threshold = 0.75
exit_z_threshold = 0.0

# --- Volume Regime Filter ---
vol_regime_fast = 20
vol_regime_slow = 50

# --- Volatility Caps (annualized %) ---
realized_vol_cap_pct = 120.0
crash_vol_exit_pct = 150.0
vol_annualize_factor = 19.105  # sqrt(365) for 24/7 crypto

# --- Risk ---
trailing_stop_atr_mult = 2.5
atr_period = 14
max_hold_days = 14
hard_stop_pct = 0.05
risk_per_trade_bps = 200
max_gross_exposure_pct = 80.0
max_positions = 3

# --- Execution ---
cooldown_days = 2

[hooks]
signals = { engine = "builtin", name = "crypto_tsm" }

[dynamic_risk]
enabled = true

# --- Exit Rules ---

[[exit_rules]]
type = "MAX_HOLDING_TIME"
[exit_rules.params]
minutes = 20160  # 14 days

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.08  # parameter key must be "pct" per evaluators.go:383

# CHANDELIER_TRAIL tested (activate ∈ {0.08, 0.15, 0.20} × giveback ∈ {0.30, 0.35, 0.50})
# — no Pareto improvement on this universe: most winners peak in 8-15% MFE range
# where trail either exits too early or never fires. Rule is implemented and
# available; omitted here pending a universe with bigger MFE tails.

# No EOD flatten — crypto trades 24/7

[options]
enabled = false
