schema_version = 2

[strategy]
id = "crypto_revert_v1"
version = "0.1.0"
name = "Crypto Mean Reversion v1 (5m)"
description = "VWAP-fade on BTC/ETH spot gated by TFI magnitude and a recent bullish liquidity sweep. Phase-1 long-only."
novice_description = """\
Short-term crypto prices often overshoot and then snap back toward their \
average — that's called mean reversion. This strategy looks for moments \
where BTC or ETH has dipped unusually far below the day's average trading \
price (VWAP) and then buys, betting the price will bounce back up toward \
the average.

We don't buy every dip blindly. We first check two things: (1) are \
aggressive sellers losing steam? (measured by the balance of buy vs. sell \
market orders), and (2) did the market recently sweep out a pool of stop \
orders below a key low? That "stop hunt" pattern often marks a short-term \
bottom right before a reversal. When both conditions agree with the dip, we \
take the long.

In plain terms: when BTC/ETH briefly dumps below a fair-price line, and the \
order flow says sellers are exhausted, we buy the bounce."""
author = "system"
created_at = "2026-04-15T00:00:00Z"

[lifecycle]
# Retired 2026-04-17 — four tuning passes with MFE/MAE data converged to
# PF ceiling ~0.40 on majors-only 15m (60 trades) and 0.27 on the 11-sym
# universe (1754 trades). Entry thesis is sound (85.6% of losers touch
# positive MFE) but retail-scale fill latency (bar-close decision →
# next-bar-open fill) plus 5 bps slippage consistently erases the edge.
# Can be reactivated if intra-bar fill simulation lands or if we add a
# lower-latency execution venue. See commits 7c38710, acf9ebc, f5378b2.
state = "Deactivated"
paper_only = true

[routing]
symbols = ["BTC/USD", "ETH/USD", "SOL/USD", "LTC/USD", "BCH/USD", "ADA/USD", "XRP/USD", "DOGE/USD", "LINK/USD", "AVAX/USD", "SUI/USD"]
timeframes = ["15m"]
priority = 55
conflict_policy = "priority_wins"
exclusive_per_symbol = false
watchlist_mode = "static"
asset_classes = ["CRYPTO"]
allowed_directions = ["LONG"]

[screening]
description = """\
5m mean-reversion on crypto spot majors. Long entries require: price
extended below session VWAP (dev_z <= entry_dev_z), trade-flow imbalance
magnitude above floor (tfi >= tfi_min, positive = buyers absorbing the drop),
and a bullish inducement sweep within the last inducement_lookback_bars.
Exits on reversion, opposite sweep, hard stop, or time stop.

Quant recalibrations vs the original doc (2026-04-15):
  * tfi_min raised from 0.0 to 0.15 — a sign-only gate admits
    too-weak flow; magnitude floor discriminates real absorption.
  * inducement_lookback_bars dropped from 3 to 2 — crypto sweeps resolve
    faster than equities (per crypto_inducement.go defaults).
  * sigma_method / sigma_lookback_bars exposed explicitly; default is
    rolling/96 (not session-reset), which the quant flagged as the likely
    cause of noisy early-session reads in the first backtest.\
"""

[params]
# --- Entry / exit thresholds (dev_z is signed, negative = below VWAP) ---
entry_dev_z      = -2.0
exit_dev_z       = -0.3
hard_stop_dev_z  = -3.5

# --- Trailing stop (quant recommendation 2026-04-17) ---
# Once unrealized PnL crosses trail_activation_pct, track the per-bar peak
# and exit when current PnL gives back more than trail_giveback_pct from
# that peak. Set trail_activation_pct = 0 to disable (default).
# MFE analysis on v9 showed 85.6% of losers touched positive MFE (avg
# +0.478%) before reverting — this rule converts those bleeders into
# locked-in small wins.
trail_activation_pct = 0.0035   # arm at +0.35%
trail_giveback_pct   = 0.0020   # exit on 0.20% retrace from peak

# --- TFI gate ---
tfi_lookback_min = 15
tfi_min          = 0.15   # recal: magnitude floor, not sign-only

# --- Sigma method for SessionVWAP ---
sigma_method        = "ewma"
sigma_lookback_bars = 96          # 8h at 5m
session_reset_utc   = 0

# --- Time & concurrency ---
time_stop_min   = 90
max_concurrent  = 2

# --- Gates ---
require_tfi              = false
require_inducement       = true
inducement_lookback_bars = 2      # recal: crypto sweeps resolve faster

# Opposite-sweep exit: quant (2026-04-16) measured 27.9% of exits fire this
# rule and are net-losing — reversion by definition requires adverse flow,
# so "opposite sweep" often means the reversion is completing and we exit
# into the thesis. Disabled after post-wiring re-baseline.
inducement_flip_enabled  = false

# --- Strategy exits take priority over book-level price exit rules ---
# When true, the position monitor skips its own price-based exit rules for
# positions opened by this strategy — the OnBar exits (reversion_complete,
# hard_stop, time_stop, inducement_flip) are authoritative. The book-level
# MAX_HOLDING_TIME (120min) and MAX_LOSS (3%) still fire as a safety net.
# Without this flag (pre-b6c9fb5-mirror), 97.4% of exits fell through to
# MAX_HOLDING_TIME because the strategy's own exits were dead code in the
# slice-pipeline backtest.
strategy_exits_priority = true

# --- Fallbacks ---
use_bar_sign_tfi = true   # phase 1 has no tick feed into strategy layer

# --- TFI source ---
# "auto"       — use live trade-tick events when available (paper/live),
#                fall back to bar-sign when ticks are stale (backtest).
# "trade_tick" — strictly tick-only; TFI stays zero in backtests.
# "bar_sign"   — force legacy bar-sign path (pre-tick-wiring behavior).
# The quant measured bar-sign TFI as net-negative in the Phase A ablation,
# so "auto" lets paper/live use real taker-side flow without changing
# backtest determinism. require_tfi stays false until paper data proves out.
tfi_source = "auto"

# --- Phase-2 gates (flip when xv-flow + skew adapters land) ---
require_xv_flow = false
require_skew_ok = false

# --- Session-time weighting (neutral defaults; tune after paper) ---
weight_us_hours   = 1.0
weight_asia_hours = 1.0
weight_weekend    = 1.0

[hooks]
signals = { engine = "builtin", name = "crypto_revert" }

[dynamic_risk]
enabled = true

# --- Exit rules (book-wide stops; the strategy's internal time_stop and
#     hard_stop are the primary path, these are the belt-and-braces layer) ---

[[exit_rules]]
type = "MAX_HOLDING_TIME"
[exit_rules.params]
minutes = 120   # slightly past strategy time_stop_min (90) as a safety net

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.03   # 3% hard book-level stop (hard_stop_dev_z should trip first)

[options]
enabled = false
