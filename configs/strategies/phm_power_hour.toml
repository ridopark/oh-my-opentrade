schema_version = 2

[strategy]
id = "phm_power_hour"
version = "1.0.0"
name = "Power Hour Momentum"
description = "Captures institutional MOC flows in the 14:30-15:50 ET window with 0DTE options"
author = "system"
created_at = "2026-04-02T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NVDA", "AMD", "AVGO", "MU", "MRVL", "SMCI", "PLTR", "CRM", "SNOW", "NET", "SOFI", "HOOD", "COIN", "AFRM", "JPM", "XOM", "OXY", "LLY", "MRNA", "HIMS", "RIVN", "RBLX", "BA", "NFLX", "IWM", "SOXL"]
timeframes = ["5m"]
priority = 60
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
asset_classes = ["OPTION"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = "Power Hour Momentum strategy captures late-day institutional MOC rebalancing flows between 14:30-15:50 ET. Best on high-volume, high-beta names with consistent Power Hour acceleration patterns."

[params]
bar_timeframe = "5m"
lookback_bars = 6                # 30min window (was 60min) — easier to break
volume_mult = 1.0                # any above-average volume (was 1.5x)
close_range_pct = 0.45           # close in top/bottom 45% (was 30%) — more permissive
atr_trail_mult = 2.0             # wider trail — stay in trades longer
stop_bps = 100                   # wider stop — less premature exit
max_signals_per_session = 5      # up from 2 — more entries per day
stagnation_bars = 6              # double patience before stagnation exit
stagnation_sd_thresh = 0.15      # half threshold — harder to trigger stagnation
limit_offset_bps = 10            # slightly more aggressive fill
risk_per_trade_bps = 300         # smaller size per trade (more attempts)
max_position_bps = 1500
allowed_hours_start = "13:00"    # start earlier (was 14:30) — wider window
allowed_hours_end = "15:50"
allowed_hours_tz = "America/New_York"
eod_flatten_time = "15:55"
htf_bias_enabled = false

[regime_filter]
enabled = false
allowed_regimes = ["TREND", "BALANCE"]
min_atr_pct = 0.4

[hooks]
signals = { engine = "builtin", name = "phm_power_hour" }

[dynamic_risk]
enabled = true
min_confidence = 0.30
risk_scale_min = 0.50
risk_scale_max = 1.00

[[exit_rules]]
type = "TRAILING_STOP"
[exit_rules.params]
atr_mult = 1.5

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 15
sd_threshold = 0.3
profit_gate_pct = 0.0

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 5

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.006

[options]
enabled = true
limit_spread_pct = 0.65
limit_buffer_bps = 300
stale_cancel_secs = 30

[options.defaults]
min_dte = 0
max_dte = 7               # wider DTE range — more contracts qualify
target_delta_low = 0.30    # accept lower delta (was 0.45)
target_delta_high = 0.70   # accept higher delta (was 0.60)
min_open_interest = 50     # lower OI floor (was 200)
max_spread_pct = 0.15      # accept wider spreads (was 0.08)
max_iv = 2.0               # higher IV tolerance (was 1.5)
