schema_version = 2

[strategy]
id = "phm_power_hour"
version = "1.0.0"
name = "Power Hour Momentum"
description = "Gao et al. intraday momentum — AM return predicts power hour direction, synthetic MOC proxy"
author = "system"
created_at = "2026-04-02T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NVDA", "AMD", "AVGO", "MU", "MRVL", "SMCI", "PLTR", "CRM", "SNOW", "NET", "SOFI", "HOOD", "COIN", "AFRM", "JPM", "XOM", "OXY", "LLY", "MRNA", "HIMS", "RIVN", "RBLX", "BA", "NFLX", "IWM", "SOXL"]
timeframes = ["5m"]
priority = 60
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
asset_classes = ["OPTION"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = "Gao et al. intraday momentum strategy. AM session return predicts power hour direction. One high-conviction entry per symbol per day at 15:15 ET, held to 15:55 EOD flatten."

[params]
bar_timeframe = "5m"
lookback_bars = 12
volume_mult = 1.5
close_range_pct = 0.30
stop_bps = 150                    # safety net only (EOD flatten exits first)
max_signals_per_session = 1       # ONE entry per session
limit_offset_bps = 5
risk_per_trade_bps = 500          # larger size (high-conviction, 1 per day)
max_position_bps = 2000
allowed_hours_start = "15:00"     # entry window start
allowed_hours_end = "15:50"       # wider entry window
allowed_hours_tz = "America/New_York"
eod_flatten_time = "15:55"
htf_bias_enabled = false

# Gao et al. intraday momentum params
am_return_min_pct = 0.55          # sweet spot for AM return
eval_time = "15:00"               # eval at power hour start
max_entry_bars = 12               # 60 min entry window on 5m
require_htf_align = false

# Synthetic MOC proxy
vol_accel_min_ratio = 1.3         # sweet spot

# MOC imbalance second entry window (live only)
second_window_enabled = false     # disabled until IBKR auction data is wired
second_window_start = "15:45"
second_window_end = "15:55"
imbalance_min_shares = 500000     # min absolute imbalance for signal

[regime_filter]
enabled = false
allowed_regimes = ["TREND", "BALANCE"]
min_atr_pct = 0.4

[hooks]
signals = { engine = "builtin", name = "phm_power_hour" }

[dynamic_risk]
enabled = true
min_confidence = 0.10
risk_scale_min = 0.50
risk_scale_max = 1.00

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 5

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.015

[options]
enabled = true
limit_spread_pct = 1.00
limit_buffer_bps = 1000
stale_cancel_secs = 30

[options.defaults]
min_dte = 7                # 7-14 DTE for better liquidity (not 0DTE)
max_dte = 14               # avoid overpaying for time
target_delta_low = 0.40    # ATM range for best fills
target_delta_high = 0.55   # ATM — tightest spreads
min_open_interest = 100    # ensure strong liquidity
max_spread_pct = 0.10      # reject illiquid strikes
max_iv = 1.5               # moderate IV tolerance
