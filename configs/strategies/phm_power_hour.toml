schema_version = 2

[strategy]
id = "phm_power_hour"
version = "1.0.0"
name = "Power Hour Momentum"
description = "Captures institutional MOC flows in the 14:30-15:50 ET window with 0DTE options"
author = "system"
created_at = "2026-04-02T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NVDA", "AMD", "AVGO", "MU", "MRVL", "SMCI", "PLTR", "CRM", "SNOW", "NET", "SOFI", "HOOD", "COIN", "AFRM", "JPM", "XOM", "OXY", "LLY", "MRNA", "HIMS", "RIVN", "RBLX", "BA", "NFLX", "IWM", "SOXL"]
timeframes = ["5m"]
priority = 60
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
asset_classes = ["OPTION"]
allowed_directions = ["LONG", "SHORT"]

[screening]
description = "Power Hour Momentum strategy captures late-day institutional MOC rebalancing flows between 14:30-15:50 ET. Best on high-volume, high-beta names with consistent Power Hour acceleration patterns."

[params]
bar_timeframe = "5m"
lookback_bars = 12               # 60min rolling window for state tracking
volume_mult = 1.5                # require above-average volume
close_range_pct = 0.30           # close in top/bottom 30% of bar
atr_trail_mult = 1.5             # ATR trailing stop multiplier
stop_bps = 60                    # max adverse move in bps
max_signals_per_session = 2      # max entries per day
stagnation_bars = 3              # bars without progress before exit
stagnation_sd_thresh = 0.30      # stagnation SD threshold
limit_offset_bps = 5
risk_per_trade_bps = 300
max_position_bps = 1500
allowed_hours_start = "13:00"    # wider window for VWAP cross opportunity
allowed_hours_end = "15:50"
allowed_hours_tz = "America/New_York"
eod_flatten_time = "15:55"
htf_bias_enabled = false
imbalance_ratio = 1.2            # buy/sell volume ratio threshold for entry
require_vwap_cross = false       # disabled — VWAP cross too rare in power hour
accel_bars = 2                   # consecutive accelerating bars needed

[regime_filter]
enabled = false
allowed_regimes = ["TREND", "BALANCE"]
min_atr_pct = 0.4

[hooks]
signals = { engine = "builtin", name = "phm_power_hour" }

[dynamic_risk]
enabled = true
min_confidence = 0.10
risk_scale_min = 0.50
risk_scale_max = 1.00

[[exit_rules]]
type = "TRAILING_STOP"
[exit_rules.params]
atr_mult = 1.5

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 15
sd_threshold = 0.3
profit_gate_pct = 0.0

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 5

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.006

[options]
enabled = true
limit_spread_pct = 1.00
limit_buffer_bps = 1000
stale_cancel_secs = 30

[options.defaults]
min_dte = 7                # 7-14 DTE for better liquidity (not 0DTE)
max_dte = 14               # avoid overpaying for time
target_delta_low = 0.40    # ATM range for best fills
target_delta_high = 0.55   # ATM — tightest spreads
min_open_interest = 100    # ensure strong liquidity
max_spread_pct = 0.10      # reject illiquid strikes
max_iv = 1.5               # moderate IV tolerance
