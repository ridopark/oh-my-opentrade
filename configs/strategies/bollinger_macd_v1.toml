schema_version = 2

[strategy]
id = "bollinger_macd_v1"
version = "2.0.0"
name = "BB+MACD Confluence (Trading Rush)"
description = "30m BB breakout + MACD histogram, 1.5x R:R dynamic target, EMA9 regime filter"
author = "system"
created_at = "2026-04-06T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "NVDA", "TSLA", "META", "AMZN", "GOOGL"]
timeframes = ["30m"]
priority = 70
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "static"
allowed_directions = ["LONG", "SHORT"]

[params]
# Bollinger Bands — close must breach upper band (%B > 1.0)
bb_breakout_threshold = 1.0

# MACD — histogram > 0 for long, < 0 for short
# Set true to also require MACD line below zero (catching early momentum)
macd_below_zero_required = false

# Risk:Reward — target = entry + ratio * (entry - swing_low)
risk_reward_ratio = 1.5

# Swing low/high lookback for stop placement
swing_lookback = 10

# Volume — set > 1.0 to require volume spike on breakout candle
volume_mult = 1.0

# Timing
allowed_hours_start = "09:35"
allowed_hours_end = "15:45"
allowed_hours_tz = "America/New_York"
cooldown_seconds = 1800
max_trades_per_day = 2
stabilization_bars = 30

[hooks]
signals = { engine = "builtin", name = "bollinger_macd" }

# Strategy handles its own stops and targets internally (1.5x R:R).
# Only keep EOD flatten as a safety net.
[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15
