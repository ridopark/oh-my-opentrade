# oh-my-opentrade configuration
# Copy this file to configs/config.yaml and customize

alpaca:
  # API credentials are loaded from .env (APCA_API_KEY_ID, APCA_API_SECRET_KEY)
  base_url: "https://paper-api.alpaca.markets"
  data_url: "https://data.alpaca.markets"
  crypto_data_url: "wss://stream.data.alpaca.markets"
  crypto_feed: "us-1"
  paper_mode: true
  # Lift the shadow-mode 250-contract cap on GetOptionChain. Pagination already
  # runs to completion; this just stops post-pagination truncation that biases
  # by raw API order rather than DTE-closeness on wide-window liquid names.
  options_chain_max_contracts: -1

database:
  host: "localhost"
  port: 5432
  user: "opentrade"
  # Password is loaded from .env (TIMESCALEDB_PASSWORD)
  dbname: "opentrade"
  ssl_mode: "disable"
  max_pool_size: 10

trading:
  max_risk_percent: 5.0
  default_slippage_bps: 10
  kill_switch_max_stops: 3
  kill_switch_window: "2m"
  kill_switch_halt_duration: "15m"
  max_daily_loss_pct: 10.0          # halt trading if daily loss exceeds 10% of equity
  max_daily_loss_usd: 10000          # halt trading if daily loss exceeds $10000

risk:
  # Per-trade expected-loss cap. Default-on with 25 bps daily / 20% per
  # trade would cap a single trade at ~0.05% of equity (~$37 on $73k),
  # which rejects most options setups. Backtests bypass this cap
  # entirely (services.go never wires it in), so flip it off here to
  # keep live sizing behavior in parity with backtest results. Note:
  # we still need mode set explicitly — applyRiskDefaults treats an
  # all-zero block as "omitted" and force-enables it.
  position_cap:
    enabled: false
    mode: "account_pct"

symbols:
  groups:
    - asset_class: "EQUITY"
      symbols:
        # Mega Cap Tech (7)
        - "AAPL"
        - "MSFT"
        - "GOOGL"
        - "AMZN"
        - "META"
        - "TSLA"
        - "NFLX"
        # Semiconductors (6)
        - "NVDA"
        - "AMD"
        - "AVGO"
        - "MU"
        - "MRVL"
        - "SMCI"
        # Software/Cloud (4)
        - "PLTR"
        - "CRM"
        - "SNOW"
        - "NET"
        # Fintech (5)
        - "SOFI"
        - "HOOD"
        - "COIN"
        - "AFRM"
        # Traditional Finance (1)
        - "JPM"
        # Energy (2)
        - "XOM"
        - "OXY"
        # Healthcare/Biotech (2)
        - "LLY"
        - "MRNA"
        # Consumer/EV (3)
        - "HIMS"
        - "RIVN"
        - "RBLX"
        # Industrials (1)
        - "BA"
        # Broad ETFs (3)
        - "SPY"
        - "QQQ"
        - "IWM"
        # Leveraged ETFs (1 — ORB only)
        - "SOXL"
      timeframe: "1m"
    - asset_class: "CRYPTO"
      symbols:
        - "BTC/USD"
        - "ETH/USD"
        - "SOL/USD"
        - "LTC/USD"
        - "BCH/USD"
        - "ADA/USD"
        - "XRP/USD"
        - "DOGE/USD"
        - "LINK/USD"
        - "AVAX/USD"
        - "SUI/USD"
      timeframe: "1m"

server:
  port: 8080
  log_level: "info"

backtest:
  fill_model: "pessimistic"         # entries at ask, exits at bid + slippage mult (live-parity)
  latency_ms_equity: 50
  latency_ms_option: 200
  fee_schedule: "ibkr_options"      # $0.65/contract, $1 min-per-order, $0.04 exchange + SEC on sells
  pessimistic_slippage_multiplier: 2.0
  synthetic_chain:
    enabled: true
    # Caps the per-expiry IV applied to BSM in the synthetic chain. The chain
    # pulls real Alpaca-collected ATM IV from iv_snapshots, which for high-vol
    # leveraged ETFs (SOXL, SOXS, SQQQ, TQQQ, UVXY) legitimately runs >1.20.
    # Applied flat to every strike via BSM, that flattens the delta surface
    # so far that 0/N candidates land in the strategy's target_delta band.
    # 0.80 keeps the surface steep enough for [0.50, 0.65] bands to catch
    # near-ATM strikes. Real fix is per-strike skew (scheduled follow-up).
    max_iv: 0.80

ai:
  base_url: "http://localhost:11434"  # any OpenAI-compatible endpoint (Ollama, LM Studio, OpenAI, vLLM)
  model: "gpt-4o-mini"               # model name to request
  # api_key: loaded from env LLM_API_KEY (required for OpenAI, OpenRouter, etc.)
  min_confidence: 0.6
  enabled: false
  # Wire the AI anchor resolver (candidate detectors + fallbackRank + async LLM).
  # When false, live uses the same static resolveSessionAnchors path as backtest
  # with no_ai=true — matching behavior for session_open/pd_high/pd_low anchors.
  anchor_resolver_enabled: false

recap:
  enabled: true
  provider: "anthropic"       # "openai" (via cfg.AI) or "anthropic" (direct)
  model: "claude-haiku-4-5"   # canonical Anthropic model id
  # base_url: defaults to https://api.anthropic.com for provider=anthropic
  # api_key_env: defaults to ANTHROPIC_API_KEY for provider=anthropic
  # run_at_hour_et: 17 (default)
  # run_at_minute_et: 15 (default)

notification:
  # telegram_bot_token: loaded from env TELEGRAM_BOT_TOKEN
  # telegram_chat_id: loaded from env TELEGRAM_CHAT_ID
  # discord_webhook_url: loaded from env DISCORD_WEBHOOK_URL
