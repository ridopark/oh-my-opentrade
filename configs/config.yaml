# oh-my-opentrade configuration
# Copy this file to configs/config.yaml and customize

alpaca:
  # API credentials are loaded from .env (APCA_API_KEY_ID, APCA_API_SECRET_KEY)
  base_url: "https://paper-api.alpaca.markets"
  data_url: "https://data.alpaca.markets"
  crypto_data_url: "wss://stream.data.alpaca.markets"
  crypto_feed: "us-1"
  paper_mode: true

database:
  host: "localhost"
  port: 5432
  user: "opentrade"
  # Password is loaded from .env (TIMESCALEDB_PASSWORD)
  dbname: "opentrade"
  ssl_mode: "disable"
  max_pool_size: 10

trading:
  max_risk_percent: 5.0
  default_slippage_bps: 10
  kill_switch_max_stops: 3
  kill_switch_window: "2m"
  kill_switch_halt_duration: "15m"
  max_daily_loss_pct: 5.0           # halt trading if daily loss exceeds 5% of equity
  max_daily_loss_usd: 5000           # halt trading if daily loss exceeds $5000

symbols:
  groups:
    - asset_class: "EQUITY"
      symbols:
        # Mega Cap Tech (7)
        - "AAPL"
        - "MSFT"
        - "GOOGL"
        - "AMZN"
        - "META"
        - "TSLA"
        - "NFLX"
        # Semiconductors (6)
        - "NVDA"
        - "AMD"
        - "AVGO"
        - "MU"
        - "MRVL"
        - "SMCI"
        # Software/Cloud (4)
        - "PLTR"
        - "CRM"
        - "SNOW"
        - "NET"
        # Fintech (5)
        - "SOFI"
        - "HOOD"
        - "COIN"
        - "AFRM"
        # Traditional Finance (1)
        - "JPM"
        # Energy (2)
        - "XOM"
        - "OXY"
        # Healthcare/Biotech (2)
        - "LLY"
        - "MRNA"
        # Consumer/EV (3)
        - "HIMS"
        - "RIVN"
        - "RBLX"
        # Industrials (1)
        - "BA"
        # Broad ETFs (3)
        - "SPY"
        - "QQQ"
        - "IWM"
        # Leveraged ETFs (1 — ORB only)
        - "SOXL"
      timeframe: "1m"
    - asset_class: "CRYPTO"
      symbols:
        - "BTC/USD"
        - "ETH/USD"
        - "SOL/USD"
        - "LTC/USD"
        - "BCH/USD"
        - "ADA/USD"
        - "XRP/USD"
        - "DOGE/USD"
        - "LINK/USD"
        - "AVAX/USD"
        - "SUI/USD"
      timeframe: "1m"

server:
  port: 8080
  log_level: "info"

backtest:
  fill_model: "pessimistic"         # entries at ask, exits at bid + slippage mult (live-parity)
  latency_ms_equity: 50
  latency_ms_option: 200
  fee_schedule: "ibkr_options"      # $0.65/contract, $1 min-per-order, $0.04 exchange + SEC on sells
  pessimistic_slippage_multiplier: 2.0

ai:
  base_url: "http://localhost:11434"  # any OpenAI-compatible endpoint (Ollama, LM Studio, OpenAI, vLLM)
  model: "gpt-4o-mini"               # model name to request
  # api_key: loaded from env LLM_API_KEY (required for OpenAI, OpenRouter, etc.)
  min_confidence: 0.6
  enabled: false

recap:
  enabled: true
  provider: "anthropic"       # "openai" (via cfg.AI) or "anthropic" (direct)
  model: "claude-haiku-4-5"   # canonical Anthropic model id
  # base_url: defaults to https://api.anthropic.com for provider=anthropic
  # api_key_env: defaults to ANTHROPIC_API_KEY for provider=anthropic
  # run_at_hour_et: 17 (default)
  # run_at_minute_et: 15 (default)

notification:
  # telegram_bot_token: loaded from env TELEGRAM_BOT_TOKEN
  # telegram_chat_id: loaded from env TELEGRAM_CHAT_ID
  # discord_webhook_url: loaded from env DISCORD_WEBHOOK_URL
