schema_version = 2

# ============================================================================
# ITERATION 7: "Pullback Sniper"
# ============================================================================
# Hypothesis: Breakout entries are catching moves too late. By the time price
# has been above AVWAP for 5-7 bars with volume, the easy money is gone. The
# option premium is already inflated from the move. Pullback entries have
# better risk/reward -- you enter AFTER a confirmed trend when price retests
# AVWAP, buying the dip in options premium.
#
# Changes from Iter 4:
#   - breakout_enabled = false (breakouts catch the move too late for options)
#   - bounce_enabled = false (low conviction)
#   - pullback_enabled = true with tighter RSI window
#   - pullback_trend_bars = 8 (was 5) -- require stronger prior trend
#   - pullback_tolerance_bps = 15 (was 30) -- price must actually touch AVWAP
#   - allowed_directions = ["LONG"] only
#   - avwap_stop_enabled = false
#   - TREND only (drop BALANCE -- pullbacks in ranging markets are traps)
#   - max_trades_per_day = 3 (more selective)
#   - SD_TARGET sd_level = 1.5 (take profits earlier -- pullbacks have less fuel)
#   - Higher delta 0.60-0.75 (more intrinsic, less time decay, tighter spread)
#
# Expected: ~40-60 trades, win rate 35-40%, PF > 1.0
# ============================================================================

[strategy]
id = "avwap_v4"
version = "4.7.0"
name = "AVWAP v4 Iter7 - Pullback Sniper"
description = "Pullback-only, long-only, TREND regime, higher delta, tighter tolerance"
author = "system"
created_at = "2026-03-27T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "U", "PLTR", "SPY", "META", "NVDA"]
timeframes = ["5m"]
priority = 80
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "replace"
asset_classes = ["OPTION"]
allowed_directions = ["LONG"]

[screening]
description = "Iter7: Pullback-only sniper. Breakouts disabled (too late for options). Enter on AVWAP retest after 8+ bar uptrend. TREND regime only. Higher delta for less theta bleed."

[params]
anchors = ["session_open"]
# BREAKOUT OFF -- by the time we confirm 5+ bars, options premium is rich
breakout_enabled = false
hold_bars = 5
volume_mult = 1.2
# BOUNCE OFF
bounce_enabled = false
rsi_bounce_max = 35.0
exit_hold_bars = 6
cooldown_seconds = 600
# More selective -- 3 trades max
max_trades_per_day = 3
# TREND ONLY -- pullbacks in BALANCE are traps, not dip-buys
allow_regimes = ["TREND"]
asset_class = "EQUITY"
# Higher lows still required -- confirms the uptrend is intact
require_higher_lows = true
higher_lows_bars = 3
midday_trap_shield = true
midday_volume_mult = 2.5
stop_bps = 75
limit_offset_bps = 5
risk_per_trade_bps = 500
max_position_bps = 2000
allowed_hours_start = "09:35"
allowed_hours_end = "11:30"
allowed_hours_tz = "America/New_York"
enforce_avwap_bias = true
# PULLBACK is the only entry type
pullback_enabled = true
# Require 8 bars (40min) of established trend before pullback qualifies
pullback_trend_bars = 8
# Tighter tolerance: price must come within 15 bps of AVWAP (was 30)
pullback_tolerance_bps = 15
# Wider RSI window -- allow entries even when not deeply oversold
pullback_rsi_min = 35.0
pullback_rsi_max = 60.0
min_slope_bps = 0.0
slope_lookback = 10
require_capitulation_for_shorts = false
# AVWAP STOP OFF
avwap_stop_enabled = false
avwap_stop_bars = 3
avwap_stop_buffer_bps = 10
pinch_enabled = false
pinch_min_bps = 5
pinch_max_bps = 50
gap_reclaim_enabled = false
gap_reclaim_bars = 5

[hooks]
signals = { engine = "builtin", name = "avwap" }

[dynamic_risk]
enabled = false

[[exit_rules]]
type = "STEP_STOP"
[exit_rules.params]
min_hold_bars = 6
bar_minutes = 5

# Lower SD target -- pullbacks have less momentum than breakouts, take profit at 1.5
[[exit_rules]]
type = "SD_TARGET"
[exit_rules.params]
sd_level = 1.5
min_hold_bars = 8
bar_minutes = 5

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 90
sd_threshold = 1.0
profit_gate_pct = 0.005

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.020

[options]
enabled = true

[options.defaults]
# Higher delta = more intrinsic value, less time decay, tighter bid/ask
min_dte = 14
max_dte = 21
target_delta_low = 0.60
target_delta_high = 0.75
min_open_interest = 100
max_spread_pct = 0.08
max_iv = 1.0

# No BALANCE override needed -- TREND only
[options.regime_overrides.BALANCE]
target_delta_low = 0.35
target_delta_high = 0.50
min_dte = 30
max_dte = 50

[symbol_overrides.TSLA]
stop_bps = 120
