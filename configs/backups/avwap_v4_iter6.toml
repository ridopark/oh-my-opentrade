schema_version = 2

# ============================================================================
# ITERATION 6: "Kill the Stops, Long Only"
# ============================================================================
# Hypothesis: The AVWAP stop is the #1 P&L destroyer. With options, you already
# have defined risk (premium paid). The AVWAP stop exits at the worst moment --
# right at the pullback trough -- then the stock recovers and you've locked in
# a loss PLUS paid two spreads. Meanwhile, shorts have been net negative in a
# bull market. Remove AVWAP stop, go LONG only, let STEP_STOP handle exits.
#
# Changes from Iter 4:
#   - avwap_stop_enabled = false  (was true, 3 bars)
#   - allowed_directions = ["LONG"] only (drop shorts)
#   - bounce_enabled = false (low conviction, high spread cost)
#   - hold_bars = 7 (was 5) -- require stronger breakout confirmation
#   - exit_hold_bars = 6 (was 4) -- give more room before AVWAP exit signal
#   - SD_TARGET sd_level = 2.0 (was 1.8) -- let winners run further
#
# Expected: Fewer trades (~60-80), higher win rate (40%+), PF > 0.9
# ============================================================================

[strategy]
id = "avwap_v4"
version = "4.6.0"
name = "AVWAP v4 Iter6 - Long Only, No AVWAP Stop"
description = "Kill AVWAP stop, long only, stronger breakout confirmation, let winners run"
author = "system"
created_at = "2026-03-27T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "U", "PLTR", "SPY", "META", "NVDA"]
timeframes = ["5m"]
priority = 80
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "replace"
asset_classes = ["OPTION"]
# LONG ONLY -- shorts bled money in Oct-Mar bull market
allowed_directions = ["LONG"]

[screening]
description = "Iter6: Long-only, AVWAP stop disabled, stronger breakout hold, higher SD target. Thesis: stop cutting winners short, let defined-risk options work."

[params]
anchors = ["session_open"]
breakout_enabled = true
# 7 bars = 35min sustained above AVWAP -- stronger confirmation
hold_bars = 7
volume_mult = 1.2
# Bounce OFF -- low conviction entries not worth the spread cost
bounce_enabled = false
# 6 bars below AVWAP before strategy-level exit (more room to breathe)
exit_hold_bars = 6
cooldown_seconds = 600
max_trades_per_day = 4
allow_regimes = ["TREND", "BALANCE"]
asset_class = "EQUITY"
require_higher_lows = true
higher_lows_bars = 3
midday_trap_shield = true
midday_volume_mult = 2.5
stop_bps = 75
limit_offset_bps = 5
risk_per_trade_bps = 500
max_position_bps = 2000
allowed_hours_start = "09:35"
allowed_hours_end = "12:30"
allowed_hours_tz = "America/New_York"
enforce_avwap_bias = true
# Pullback still on -- it's a higher-conviction entry than breakout
pullback_enabled = true
pullback_trend_bars = 5
pullback_tolerance_bps = 30
pullback_rsi_min = 30.0
pullback_rsi_max = 65.0
min_slope_bps = 0.0
slope_lookback = 10
require_capitulation_for_shorts = false
# AVWAP STOP OFF -- this is the key change. Let STEP_STOP handle exits.
avwap_stop_enabled = false
avwap_stop_bars = 3
avwap_stop_buffer_bps = 10
pinch_enabled = false
pinch_min_bps = 5
pinch_max_bps = 50
gap_reclaim_enabled = false
gap_reclaim_bars = 5

[hooks]
signals = { engine = "builtin", name = "avwap" }

[dynamic_risk]
enabled = false

[[exit_rules]]
type = "STEP_STOP"
[exit_rules.params]
min_hold_bars = 6
bar_minutes = 5

# Higher SD target -- let winners run to +2.0 SD
[[exit_rules]]
type = "SD_TARGET"
[exit_rules.params]
sd_level = 2.0
min_hold_bars = 10
bar_minutes = 5

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 90
sd_threshold = 1.0
profit_gate_pct = 0.005

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.020

[options]
enabled = true

[options.defaults]
min_dte = 21
max_dte = 30
target_delta_low = 0.55
target_delta_high = 0.70
min_open_interest = 100
max_spread_pct = 0.10
max_iv = 1.0

[options.regime_overrides.BALANCE]
target_delta_low = 0.35
target_delta_high = 0.50
min_dte = 30
max_dte = 50

[symbol_overrides.TSLA]
stop_bps = 120
