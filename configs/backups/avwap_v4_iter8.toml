schema_version = 2

# ============================================================================
# ITERATION 8: "ITM Breakout + Gap Reclaim, Wider Stops"
# ============================================================================
# Hypothesis: The fundamental problem is options spread cost eating into a
# marginally profitable equity signal. Fix this at the instrument level: go
# deep ITM (delta 0.75-0.90) so the option behaves like stock with defined
# risk. Spread as % of premium is much smaller for ITM options. Also add
# gap_reclaim -- a failed breakdown that reclaims AVWAP is one of the highest
# win-rate setups because it traps shorts. Combined with wider AVWAP stop
# (6 bars instead of 3) for the entries that need more room.
#
# Changes from Iter 4:
#   - target_delta 0.75-0.90 (deep ITM -- behaves like stock, tiny spread %)
#   - min_dte = 7, max_dte = 14 (shorter DTE since deep ITM has low theta)
#   - gap_reclaim_enabled = true (high win-rate reversal setup)
#   - avwap_stop_bars = 6 (was 3) -- double the tolerance
#   - avwap_stop_buffer_bps = 25 (was 10) -- wider buffer
#   - allowed_directions = ["LONG"] only
#   - bounce_enabled = false
#   - require_higher_lows = false (gap reclaim doesn't need this)
#   - STEP_STOP min_hold_bars = 4 (was 6) -- activate breakeven faster
#   - max_spread_pct = 0.05 (tighter spread requirement for deep ITM)
#   - allowed_hours_end = "14:00" (extend window -- deep ITM has less theta)
#
# Expected: ~80-100 trades, win rate 35%+, PF > 1.0
# ============================================================================

[strategy]
id = "avwap_v4"
version = "4.8.0"
name = "AVWAP v4 Iter8 - Deep ITM + Gap Reclaim"
description = "Deep ITM options (delta 0.75-0.90), gap reclaim enabled, wider AVWAP stop, extended hours"
author = "system"
created_at = "2026-03-27T00:00:00Z"

[lifecycle]
state = "PaperActive"
paper_only = true

[routing]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "U", "PLTR", "SPY", "META", "NVDA"]
timeframes = ["5m"]
priority = 80
conflict_policy = "priority_wins"
exclusive_per_symbol = true
watchlist_mode = "replace"
asset_classes = ["OPTION"]
allowed_directions = ["LONG"]

[screening]
description = "Iter8: Deep ITM options minimize spread drag. Gap reclaim adds high-conviction reversal entries. Wider AVWAP stop gives trades room. Extended session since deep ITM has minimal theta."

[params]
anchors = ["session_open"]
breakout_enabled = true
hold_bars = 5
volume_mult = 1.2
# BOUNCE OFF
bounce_enabled = false
rsi_bounce_max = 35.0
exit_hold_bars = 5
cooldown_seconds = 600
max_trades_per_day = 4
allow_regimes = ["TREND", "BALANCE"]
asset_class = "EQUITY"
# Higher lows OFF -- gap reclaim works without ascending lows pattern
require_higher_lows = false
higher_lows_bars = 3
midday_trap_shield = true
midday_volume_mult = 2.5
stop_bps = 75
limit_offset_bps = 5
risk_per_trade_bps = 500
max_position_bps = 2000
# Extended to 2pm -- deep ITM theta is negligible intraday
allowed_hours_start = "09:35"
allowed_hours_end = "14:00"
allowed_hours_tz = "America/New_York"
enforce_avwap_bias = true
pullback_enabled = true
pullback_trend_bars = 5
pullback_tolerance_bps = 30
pullback_rsi_min = 30.0
pullback_rsi_max = 65.0
min_slope_bps = 0.0
slope_lookback = 10
require_capitulation_for_shorts = false
# AVWAP STOP ON but much more lenient -- 6 bars (30 min) with 25 bps buffer
avwap_stop_enabled = true
avwap_stop_bars = 6
avwap_stop_buffer_bps = 25
pinch_enabled = false
pinch_min_bps = 5
pinch_max_bps = 50
# GAP RECLAIM ON -- failed breakdowns that reclaim AVWAP trap shorts
gap_reclaim_enabled = true
gap_reclaim_bars = 4

[hooks]
signals = { engine = "builtin", name = "avwap" }

[dynamic_risk]
enabled = false

# Faster STEP_STOP activation -- move to breakeven sooner with deep ITM
[[exit_rules]]
type = "STEP_STOP"
[exit_rules.params]
min_hold_bars = 4
bar_minutes = 5

[[exit_rules]]
type = "SD_TARGET"
[exit_rules.params]
sd_level = 1.8
min_hold_bars = 8
bar_minutes = 5

[[exit_rules]]
type = "STAGNATION_EXIT"
[exit_rules.params]
minutes = 90
sd_threshold = 1.0
profit_gate_pct = 0.005

[[exit_rules]]
type = "EOD_FLATTEN"
[exit_rules.params]
minutes_before_close = 15

[[exit_rules]]
type = "MAX_LOSS"
[exit_rules.params]
pct = 0.020

[options]
enabled = true

[options.defaults]
# DEEP ITM -- option price tracks stock nearly 1:1, spread is tiny % of premium
min_dte = 7
max_dte = 14
target_delta_low = 0.75
target_delta_high = 0.90
min_open_interest = 50
# Tighter spread required -- deep ITM should have tight markets
max_spread_pct = 0.05
max_iv = 1.0

[options.regime_overrides.BALANCE]
target_delta_low = 0.65
target_delta_high = 0.80
min_dte = 14
max_dte = 21

[symbol_overrides.TSLA]
stop_bps = 120
