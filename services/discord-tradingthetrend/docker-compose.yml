services:
  watcher:
    build:
      context: ..
      dockerfile: discord-tradingthetrend/Dockerfile
    container_name: omo-discord-tradingthetrend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:${WSL_HOST_IP:?set WSL_HOST_IP or run \"make restart-tradingthetrend\" from repo root}"
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
    volumes:
      - ./state:/app/state
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import pathlib, time, sys
          p = pathlib.Path('/app/state/heartbeat')
          sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime < 120 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bootstrap:
    build:
      context: ..
      dockerfile: discord-tradingthetrend/Dockerfile
    container_name: omo-discord-tradingthetrend-bootstrap
    profiles: ["bootstrap"]
    network_mode: host
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ./state:/app/state
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    command: ["python3", "-m", "discord_common.bootstrap"]

  scrape:
    build:
      context: ..
      dockerfile: discord-tradingthetrend/Dockerfile
    container_name: omo-discord-tradingthetrend-scrape
    profiles: ["scrape"]
    network_mode: host
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
    volumes:
      - ./state:/app/state
    entrypoint: ["python3", "-m", "scrape_history"]
