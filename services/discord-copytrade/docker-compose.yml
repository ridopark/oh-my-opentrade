services:
  watcher:
    build:
      context: ..
      dockerfile: discord-copytrade/Dockerfile
    container_name: omo-discord-copytrade
    restart: unless-stopped
    # Docker Desktop's host-gateway points at the Docker VM, not the WSL2
    # distro where omo-core runs. WSL_HOST_IP is supplied at compose-up time
    # by `make restart-copytrade`, which reads the current eth0 IP.
    extra_hosts:
      - "host.docker.internal:${WSL_HOST_IP:?set WSL_HOST_IP or run \"make restart-copytrade\" from repo root}"
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
    volumes:
      - ./state:/app/state
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import pathlib, time, sys
          p = pathlib.Path('/app/state/heartbeat')
          sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime < 120 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bootstrap:
    build:
      context: ..
      dockerfile: discord-copytrade/Dockerfile
    container_name: omo-discord-copytrade-bootstrap
    profiles: ["bootstrap"]
    network_mode: host
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ./state:/app/state
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    command: ["python3", "-m", "discord_common.bootstrap"]

  scrape:
    build:
      context: ..
      dockerfile: discord-copytrade/Dockerfile
    container_name: omo-discord-copytrade-scrape
    profiles: ["scrape"]
    network_mode: host
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
    volumes:
      - ./state:/app/state
    # --out matches what the backtest loader expects. The backend defaults
    # to services/discord-copytrade/state/history_90d.jsonl in backtest_handler.go.
    # Without this override the scrape would write history.jsonl (the shared
    # scraper default) and the backtest would keep reading a stale snapshot.
    entrypoint: ["python3", "-m", "scrape_history", "--out", "/app/state/history_90d.jsonl"]
