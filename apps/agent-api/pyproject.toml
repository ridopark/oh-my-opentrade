[project]
name = "agent-api"
version = "0.1.0"
description = "Natural-language query sidecar for the oh-my-opentrade dashboard."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3.20",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3.20",
    "langgraph>=0.2.60",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "slowapi>=0.1.9",
    "httpx>=0.28",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
